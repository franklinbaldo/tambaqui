name: Static surface check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tabela_de_atualizacao_ec113.json'
      - '.github/workflows/static-surface-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tabela_de_atualizacao_ec113.json'
      - '.github/workflows/static-surface-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static surface boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          payload = json.loads(Path('tabela_de_atualizacao_ec113.json').read_text(encoding='utf-8'))
          factors = payload.get('Fator')

          assert isinstance(factors, dict) and factors, 'dataset must expose a non-empty Fator mapping'
          assert all(len(key) == 7 and key[4] == '-' for key in factors), 'factor keys must use YYYY-MM'
          assert 'Promise.resolve(1.1)' not in html, 'public calculator must not use the placeholder factor'
          assert "fetch('tabela_de_atualizacao_ec113.json')" in html, 'surface must load the versioned EC113 dataset'
          assert 'role="alert"' in html, 'calculation/data errors need an announced state'
          assert "script-src 'self' 'unsafe-inline'" in html, 'CSP must permit the current inline script architecture'
          assert 'https://www.tjsp.jus.br/Download/Tabelas/TabelaEmendaConstitucional113-2021.pdf' in html, 'upstream TJSP source must be recoverable from the surface'
          assert 'href="tabela_de_atualizacao_ec113.json"' in html, 'the exact public JSON dataset must be recoverable from the surface'
          assert 'id="factorCoverage"' in html, 'surface must expose the dataset coverage region'
          assert 'Object.keys(factors).sort()' in html, 'factor coverage must be derived from the loaded dataset'
          assert 'time.dateTime = month' in html, 'displayed factor coverage must expose machine-readable YYYY-MM values'
          assert min(factors) == '1964-10', 'unexpected first factor month'
          assert max(factors) == '2023-10', 'unexpected last factor month; verify upstream refresh before changing this assertion'
          print(f'validated {len(factors)} EC113 factors ({min(factors)}..{max(factors)}) and public surface contract')
          PY

  browser-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium driver
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture valid and missing-factor states
        run: |
          python -m http.server 4173 >/tmp/tambaqui-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            fs.mkdirSync('artifacts/browser-proof', { recursive: true });
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.locator('#factorCoverage time').first().waitFor();

            await page.locator('#updateFromInput').fill('2023-10-01');
            await page.locator('#updateToInput').fill('2023-10-15');
            await page.locator('#descriptionInput').fill('Prova de superfície');
            await page.locator('#amountInput').fill('100');
            await page.locator('#addEntryButton').click();
            await page.getByText('Prova de superfície').waitFor();
            if (await page.locator('#errorMessage').isVisible()) throw new Error('valid factor state unexpectedly showed an error');
            await page.screenshot({ path: 'artifacts/browser-proof/valid-calculation.png', fullPage: true });

            await page.locator('#updateFromInput').fill('2024-01-01');
            await page.locator('#updateToInput').fill('2024-01-15');
            await page.locator('#descriptionInput').fill('Fator ausente');
            await page.locator('#amountInput').fill('100');
            await page.locator('#addEntryButton').click();
            const error = page.locator('#errorMessage');
            await error.waitFor({ state: 'visible' });
            if (!(await error.textContent()).includes('Não há fator disponível para 2024-01')) throw new Error('missing-factor state did not expose the expected error');
            await page.screenshot({ path: 'artifacts/browser-proof/missing-factor.png', fullPage: true });

            await browser.close();
          })();
          JS
      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: tambaqui-browser-proof
          path: artifacts/browser-proof/*.png
          if-no-files-found: error
